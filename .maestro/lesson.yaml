# Une leçon : verdict en bas, bouton retour Android, fin de leçon.
appId: fr.citeparlia.quizgeo
---
- launchApp
# Fenêtre système « … isn't responding » de l'émulateur : on attend.
- tapOn:
    text: "Wait|Attendre"
    optional: true
- waitForAnimationToEnd
- tapOn: "Le vocabulaire de base"
- waitForAnimationToEnd
- takeScreenshot: shots/10-feuille-unite
# Bouton retour avec la feuille ouverte : doit la fermer, pas quitter l'app.
- pressKey: back
- waitForAnimationToEnd
- takeScreenshot: shots/10b-retour-ferme-la-feuille
- assertVisible: "Le vocabulaire de base"
- tapOn: "Le vocabulaire de base"
- waitForAnimationToEnd
- tapOn: "Commencer ·.*"
- waitForAnimationToEnd
- takeScreenshot: shots/11-question-1
# Bouton retour Android : doit demander confirmation, pas quitter.
- pressKey: back
- waitForAnimationToEnd
- takeScreenshot: shots/12-retour-android
- tapOn:
    text: "Annuler|Cancel"
    optional: true
- repeat:
    times: 14
    commands:
      # Un choix au hasard (zone des réponses), puis Vérifier / Continuer.
      - tapOn:
          point: "50%,38%"
          optional: true
      - tapOn:
          text: "Vérifier"
          optional: true
      - waitForAnimationToEnd
      - takeScreenshot: shots/13-verdict
      - tapOn:
          text: "Continuer|Décision suivante|Voir le bilan"
          optional: true
      - waitForAnimationToEnd
- takeScreenshot: shots/14-apres-questions
