# Construit l'APK Android (signé avec la clé de debug : installable pour tester,
# pas pour le Play Store). Se lance à la main, ou sur un tag v*.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nom de la release à publier (ex. v0.1.0). Le tag est créé s’il n’existe pas.'
        required: true
        default: 'v0.1.0'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Générer le projet natif
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Ne compiler que pour les téléphones (arm), pas les émulateurs (x86)
        run: |
          printf '\nreactNativeArchitectures=arm64-v8a,armeabi-v7a\n' >> android/gradle.properties
          grep reactNativeArchitectures android/gradle.properties
      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Nom de version
        id: version
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk quizgeo-${{ steps.version.outputs.tag }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quizgeo-apk
          path: quizgeo-*.apk
      - name: Publier la release (téléchargement direct de l'APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Quiz GEO ${{ steps.version.outputs.tag }}
          files: quizgeo-*.apk
          generate_release_notes: true
