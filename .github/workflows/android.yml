# Construit l'APK Android (signé avec la clé de debug : installable pour tester,
# pas pour le Play Store). Se lance à la main, ou sur un tag v*.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Nom de la release à publier (ex. v0.1.0). Le tag est créé s’il n’existe pas.'
        required: true
        default: 'v0.1.0'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Clé de signature de release (secret du dépôt). Sans elle, l'APK est
      # signé avec la clé de debug — que Chrome et Play Protect jugent dangereuse.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Générer le projet natif
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Ne compiler que pour les téléphones (arm), pas les émulateurs (x86)
        run: |
          printf '\nreactNativeArchitectures=arm64-v8a,armeabi-v7a\n' >> android/gradle.properties
          grep reactNativeArchitectures android/gradle.properties
      - name: Signer avec la clé de release
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          node tools/android-signing.js android/app/build.gradle
          echo "SIGNING=release" >> "$GITHUB_ENV"
      - name: Avertir si la clé de release manque
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: |
          echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : APK signé en debug (Chrome le bloquera). Voir docs/play-store/signature.md"
          echo "SIGNING=debug" >> "$GITHUB_ENV"
      - name: Compiler
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Nom de version
        id: version
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk quizgeo-${{ steps.version.outputs.tag }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: quizgeo-apk
          path: quizgeo-*.apk
      - name: Vérifier la signature de l'APK
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs quizgeo-*.apk | grep -E "Signer|SHA-256" || true
          echo "Signature : $SIGNING"
      - name: Publier la release (téléchargement direct de l'APK)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Quiz GEO ${{ steps.version.outputs.tag }}
          files: quizgeo-*.apk
          generate_release_notes: true
          body: |
            ## Installer sur Android

            1. Télécharge le fichier `.apk` ci-dessous.
            2. Si Chrome affiche « ce fichier peut être dangereux » : appuie sur **Conserver** (c'est le cas de toute application hors Play Store).
            3. Ouvre le fichier. Si Android demande d'autoriser l'installation depuis ce navigateur : **Autoriser**, puis **Installer**.
            4. Si Play Protect s'en mêle : **Plus de détails → Installer quand même**.

            L'application est signée (`${{ env.SIGNING }}`), sans publicité, sans compte, et ne transmet aucune donnée. Les mises à jour s'installent par-dessus sans perdre la progression.
