# Publie la version web sur GitHub Pages à chaque push sur main.
# URL : https://theo-pezet.github.io/quizgeo/
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configurer Pages (crée le site s'il n'existe pas)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Exporter le site
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_BASE_PATH: /quizgeo
          CI: 1
      - name: Fallback SPA pour les liens profonds
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
