# Publie la version web sur GitHub Pages à chaque push sur main, via la
# branche gh-pages (GitHub l'active automatiquement sur un dépôt public).
# URL : https://theo-pezet.github.io/quizgeo/
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exporter le site
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_BASE_PATH: /quizgeo
          CI: 1
      - name: Fallback SPA pour les liens profonds, et pas de Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Pousser sur gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
