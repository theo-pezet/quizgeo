# Teste l'app dans un émulateur Android (API 34), sans téléphone : mise à
# jour depuis la version précédente, onboarding, leçon, bouton retour,
# clavier, rappels. Captures et vidéo publiées sur la branche device-tests.
#
# L'APK publié ne contient que le code arm64 (téléphones) et l'émulateur est
# x86_64 : on recompile donc chaque version testée pour x86_64, depuis le
# code exact de son tag et avec la même clé de signature.
name: Test sur émulateur

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release à tester (ex. v1.2.0)'
        required: true
        default: 'v1.2.1'
      prev_tag:
        description: 'Release précédente, pour tester la mise à jour (vide = pas de test de mise à jour)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        role: [app, prev]
    runs-on: ubuntu-latest
    env:
      REF: ${{ matrix.role == 'app' && github.event.inputs.tag || github.event.inputs.prev_tag }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        if: env.REF != ''
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v4
        if: env.REF != ''
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        if: env.REF != ''
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        if: env.REF != ''
        with:
          packages: platform-tools
      - name: Compiler pour l'émulateur (x86_64)
        if: env.REF != ''
        run: |
          npm ci
          CI=1 npx expo prebuild --platform android --no-install
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            node tools/android-signing.js android/app/build.gradle
          fi
          cd android && chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64 || ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/${{ matrix.role }}.apk"
      - uses: actions/upload-artifact@v4
        if: env.REF != ''
        with:
          name: apk-${{ matrix.role }}
          path: ${{ matrix.role }}.apk

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag }}
      PREV_TAG: ${{ github.event.inputs.prev_tag }}
      MAESTRO_CLI_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
      - run: ls -la *.apk
      - name: Activer KVM (émulateur accéléré)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Installer Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Émulateur + scénarios
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./tools/device-test.sh
      - name: Publier les résultats sur la branche device-tests
        if: always()
        run: |
          set -e
          DIR="runs/${TAG}-${{ github.run_id }}"
          mkdir -p /tmp/res && cp -r out/. /tmp/res/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin device-tests || true
          if git rev-parse --verify origin/device-tests >/dev/null 2>&1; then
            git checkout -B device-tests origin/device-tests
          else
            git checkout --orphan device-tests && git rm -rf . > /dev/null
          fi
          mkdir -p "$DIR" && cp -r /tmp/res/. "$DIR/"
          git add runs && git commit -m "Test émulateur $TAG (run ${{ github.run_id }})" && git push origin device-tests
