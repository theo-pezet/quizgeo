# TEMPORAIRE : aperçu web de la branche pour la relecture, retiré avant la fusion.
name: Web preview (temporaire)
on:
  push:
    branches: [ameliorations-retours-joueur]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_BASE_PATH: /quizgeo
          CI: 1
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: web-preview-tmp
          force_orphan: true
